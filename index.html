<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>World Mission Cultural Day — Login</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="card">
    <header class="brand">
      <div class="logo">🌍</div>
      <h1>World Mission</h1>
      <p class="tag">Cultural Day Registration Portal</p>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="login">Login</button>
      <button class="tab" data-tab="signup">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="form active">
      <label>Email
        <input type="email" id="loginEmail" required placeholder="you@school.com" />
      </label>
      <label>Password
        <input type="password" id="loginPassword" required placeholder="••••••••" />
      </label>
      <button type="submit" class="btn-primary">Login</button>
      <p class="msg" id="loginMsg"></p>
    </form>

    <!-- SIGNUP -->
    <form id="signupForm" class="form">
      <label>Full Name
        <input type="text" id="signupName" required placeholder="Jane Doe" />
      </label>
      <label>Email
        <input type="email" id="signupEmail" required placeholder="you@school.com" />
      </label>
      <label>Password
        <input type="password" id="signupPassword" required minlength="6" placeholder="At least 6 characters" />
      </label>
      <button type="submit" class="btn-primary">Create Account</button>
      <p class="msg" id="signupMsg"></p>
    </form>
  </main>
  <footer class="foot">© 2026 worldmissionculturalday.com</footer>
  <script src="app.js"></script>
</body>
</html>
